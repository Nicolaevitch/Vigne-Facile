# 📌 Projet DataLake3 - Gestion Météo, Trafic & Actions Vigneron

## 📝 Description
Ce projet est un pipeline de traitement de données permettant de collecter, transformer et analyser des données météorologiques, de trafic et de gestion des ressources agricoles. Il intègre **Airflow**, **SQLite**, **Elasticsearch**, **Kibana** et **PySpark** pour offrir une solution robuste de monitoring et de décision automatisée pour les vignerons.

## 🚀 Fonctionnalités Principales
✅ **Extraction de données météo** via une API public
✅ **Analyse du trafic en temps réel** avec OSRM
✅ **Calcul des actions possibles** en fonction de la météo
✅ **Vérification des stocks et des ressources disponibles**
✅ **Stockage des données dans SQLite et indexation sur Elasticsearch**
✅ **Visualisation des données avec Kibana**
✅ **Orchestration et automatisation avec Apache Airflow**

## 📂 Structure du Projet
```
project_datalake3/
│── Airflow/
│   ├── dags/
│   │   ├── dag2.py            # DAG Airflow pour orchestrer les tâches
│   ├── logs/                  # Logs d'exécution
│
│── scripts/
│   ├── meteo_etl.py           # Extraction et traitement des données météo
│   ├── etat_traffic.py        # Analyse du trafic en temps réel
│   ├── action_prioritaire.py  # Décision des actions agricoles
│   ├── send_to_elastic.py     # Envoi des données vers Elasticsearch
│
│── data/
│   ├── meteo.db               # Base SQLite contenant les données
│   ├── formatted/
│   │   ├── meteo_data.parquet # Données transformées stockées en Parquet
│
│── jars/
│   ├── sqlite-jdbc-3.36.0.3.jar # Driver JDBC pour SQLite
│
│── lancement_projet.sh         # Script de lancement global
```

## ⚙️ Installation
### 1️⃣ Cloner le projet
```sh
git clone https://github.com/votre-repo/project_datalake3.git
cd project_datalake3
```
### 2️⃣ Installer les dépendances
```sh
pip install -r dependances.txt
```
**Fichier `dependances.txt` :**
```
pandas
requests
pyspark
elasticsearch
apache-airflow
```

### 3️⃣ Lancer Airflow
```sh
airflow standalone
```

### 4️⃣ Démarrer Elasticsearch & Kibana
```sh
# Démarrer Elasticsearch
sudo systemctl start elasticsearch

# Démarrer Kibana
sudo systemctl start kibana
```

## 🛠️ Utilisation
### 📡 **Exécution Manuelle des Scripts**
```sh
python scripts/meteo_etl.py
python scripts/etat_traffic.py
python scripts/action_prioritaire.py
python scripts/send_to_elastic.py
```

### 🔄 **Exécution Automatisée avec Airflow**
Vérifier les DAGs dans l interface Web Airflow :
```sh
airflow webserver
```
Puis naviguer vers [http://localhost:8080](http://localhost:8080) et activer `dag2.py`.

## 📊 Visualisation avec Kibana
Une fois Elasticsearch et Kibana lancés, aller sur :
[http://localhost:5601](http://localhost:5601)
- Créer un **Index Pattern** `actions_vigneron` et `action_prioritaire`
- Explorer les données sous forme de **graphes et tableaux interactifs**

